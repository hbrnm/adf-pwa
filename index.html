<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ADF">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>ADF Protocol</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --card-elevated: #2C2C2E;
      --sep: #38383A;
      --text: #FFFFFF;
      --text-sec: #8E8E93;
      --text-ter: #636366;
      --green: #32D74B;
      --orange: #FF9F0A;
      --red: #FF453A;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      padding-top: calc(env(safe-area-inset-top, 16px) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 84px);
      max-width: 480px;
      margin: 0 auto;
      user-select: none;
    }
    header {
      padding: 0 16px 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .avg-badge {
      font-size: 13px;
      color: var(--text-sec);
    }
    /* Segmented Control */
    .segmented {
      display: flex;
      background: var(--card);
      padding: 2px;
      border-radius: 9px;
      margin-bottom: 16px;
    }
    .seg-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 0;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: var(--card-elevated);
      color: var(--text);
      font-weight: 600;
    }
    /* Day Selector */
    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 0 16px 16px;
    }
    .day-pill {
      background: var(--card);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 0;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .day-pill.active {
      background: var(--card-elevated);
      border-color: var(--sep);
    }
    .day-pill span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sec);
    }
    .day-pill.active span {
      color: var(--text);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot.feast { background: var(--green); }
    .dot.fast { background: var(--orange); }

    /* Content Sections */
    .container {
      padding: 0 16px;
    }
    .summary-card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .day-type {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .day-type.feast { color: var(--green); }
    .day-type.fast { color: var(--orange); }
    .progress-label {
      font-size: 13px;
      color: var(--text-sec);
    }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 0.5px solid var(--sep);
    }
    .metric-val {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .metric-lbl {
      font-size: 12px;
      color: var(--text-sec);
      margin-top: 2px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-sec);
      letter-spacing: 0.4px;
      margin: 20px 0 8px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .group-list {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      position: relative;
    }
    .list-item:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 44px;
      right: 0;
      height: 0.5px;
      background: var(--sep);
    }
    .check-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--text-ter);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .list-item.done .check-circle {
      background: var(--green);
      border-color: var(--green);
    }
    .check-circle svg {
      width: 12px;
      height: 12px;
      stroke: #000;
      stroke-width: 2.5;
      fill: none;
      opacity: 0;
    }
    .list-item.done .check-circle svg {
      opacity: 1;
    }
    .item-body {
      flex: 1;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }
    .item-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .list-item.done .item-title,
    .list-item.done .item-desc {
      color: var(--text-ter);
      text-decoration: line-through;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sec);
    }
    .item-desc {
      font-size: 13px;
      color: var(--text-sec);
      line-height: 1.4;
    }

    /* Weight & Backup */
    .input-card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    input[type="number"], input[type="date"] {
      background: var(--card-elevated);
      border: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      flex: 1;
    }
    .btn-primary {
      background: var(--text);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--card-elevated);
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Bottom Rest Timer Bar */
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--sep);
      padding: 10px 16px calc(env(safe-area-inset-bottom, 12px) + 10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 480px;
      margin: 0 auto;
    }
    .timer-display {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      min-width: 68px;
    }
    .timer-btns {
      display: flex;
      gap: 6px;
    }
    .t-btn {
      background: var(--card-elevated);
      color: var(--text);
      border: none;
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .t-btn.active {
      background: var(--green);
      color: #000;
      font-weight: 600;
    }
  </style>
</head>

    let state = { checks: {}, weights: [] };
    try {
      const saved = localStorage.getItem('adf_ios_state_v2');
      if (saved) state = JSON.parse(saved);
    } catch (e) {}

    function saveState() {
      try {
        localStorage.setItem('adf_ios_state_v2', JSON.stringify(state));
      } catch (e) {}
    }

    const jsDay = new Date().getDay();
    let currentDayIdx = jsDay === 0 ? 6 : jsDay - 1;

    function renderDayStrip() {
      const strip = document.getElementById('day-strip');
      strip.innerHTML = DAYS.map((d, i) => `
        <div class="day-pill ${i === currentDayIdx ? 'active' : ''}" onclick="selectDay(${i})">
          <span>${d.short}</span>
          <div class="dot ${d.type}"></div>
        </div>
      `).join('');
    }

    function selectDay(idx) {
      currentDayIdx = idx;
      renderDayStrip();
      renderDayContent();
    }

    function toggleItem(id) {
      state.checks[id] = !state.checks[id];
      saveState();
      renderDayContent();
      renderShopping();
    }

    function resetCurrentDay() {
      const d = DAYS[currentDayIdx];
      d.meals.forEach(m => delete state.checks[m.id]);
      d.exercises.forEach(e => delete state.checks[e.id]);
      saveState();
      renderDayContent();
    }

    function renderDayContent() {
      const d = DAYS[currentDayIdx];
      const totalItems = d.meals.length + d.exercises.length;
      const doneItems = d.meals.filter(m => state.checks[m.id]).length + d.exercises.filter(e => state.checks[e.id]).length;

      const checkSvg = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

      document.getElementById('day-content').innerHTML = `
        <div class="summary-card">
          <div class="summary-top">
            <div class="day-type ${d.type}">
              <div class="dot ${d.type}"></div>
              <span>${d.name} · ${d.label}</span>
            </div>
            <div class="progress-label">${doneItems}/${totalItems} completate</div>
          </div>
          <div class="metrics-row">
            <div>
              <div class="metric-val">${d.kcal}</div>
              <div class="metric-lbl">kcal țintă</div>
            </div>
            <div>
              <div class="metric-val">${d.prot}g</div>
              <div class="metric-lbl">Proteine</div>
            </div>
            <div>
              <div class="metric-val">${d.type === 'fast' ? 'Peri-Sală' : '4 Mese'}</div>
              <div class="metric-lbl">Timing</div>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>Plan Alimentar</span>
          <span style="text-transform:none;cursor:pointer;" onclick="resetCurrentDay()">Resetează ziua</span>
        </div>
        <div class="group-list">
          ${d.meals.map(m => `
            <div class="list-item ${state.checks[m.id] ? 'done' : ''}" onclick="toggleItem('${m.id}')">
              <div class="check-circle">${checkSvg}</div>
              <div class="item-body">
                <div class="item-header">
                  <span class="item-title">${m.time} · ${m.name}</span>
                  <span class="item-meta">${m.meta}</span>
                </div>
                <div class="item-desc">${m.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="section-title">
          <span>${d.workoutTitle}</span>
        </div>
        <div class="group-list">
          ${d.exercises.map(e => `
            <div class="list-item ${state.checks[e.id] ? 'done' : ''}" onclick="toggleItem('${e.id}')">
              <div class="check-circle">${checkSvg}</div>
              <div class="item-body">
                <div class="item-header">
                  <span class="item-title">${e.name}</span>
                  <span class="item-meta">${e.sets}</span>
                </div>
                <div class="item-desc">${e.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderShopping() {
      const checkSvg = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      document.getElementById('tab-shop').innerHTML = `
        <div class="section-title">
          <span>Listă Săptămânală</span>
          <span style="text-transform:none;cursor:pointer;" onclick="resetShop()">Debifează tot</span>
        </div>
        <div class="group-list">
          ${SHOPPING.map(s => `
            <div class="list-item ${state.checks[s.id] ? 'done' : ''}" onclick="toggleItem('${s.id}')">
              <div class="check-circle">${checkSvg}</div>
              <div class="item-body">
                <div class="item-header">
                  <span class="item-title">${s.name}</span>
                  <span class="item-meta">${s.qty}</span>
                </div>
                <div class="item-desc">${s.cat}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function resetShop() {
      SHOPPING.forEach(s => delete state.checks[s.id]);
      saveState();
      renderShopping();
    }

    function renderWeight() {
      const today = new Date().toISOString().split('T')[0];
      const listHtml = state.weights.slice().reverse().map((w, idx, arr) => {
        const prev = arr[idx + 1];
        let deltaStr = '';
        if (prev) {
          const diff = (w.kg - prev.kg).toFixed(1);
          const color = diff <= 0 ? 'var(--green)' : 'var(--orange)';
          deltaStr = `<span style="color:${color};margin-left:8px;">${diff > 0 ? '+' : ''}${diff} kg</span>`;
        }
        return `
          <div class="list-item" style="cursor:default;">
            <div class="item-body">
              <div class="item-header">
                <span class="item-title">${w.kg.toFixed(1)} kg ${deltaStr}</span>
                <span class="item-meta">${w.date}</span>
              </div>
            </div>
          </div>
        `;
      }).join('') || `<div class="list-item"><div class="item-desc">Nicio cântărire salvată încă.</div></div>`;

      document.getElementById('tab-weight').innerHTML = `
        <div class="input-card">
          <div style="font-size:15px;font-weight:600;">Cântărire Oficială (Luni & Joi dimineața)</div>
          <div style="font-size:13px;color:var(--text-sec);margin-top:4px;">După zilele de hrănire, pentru o evaluare reală a apei și glicogenului.</div>
          <div class="input-row">
            <input type="date" id="w-date" value="${today}">
            <input type="number" id="w-kg" step="0.1" placeholder="105.0">
            <button class="btn-primary" onclick="addWeight()">Salvează</button>
          </div>
        </div>

        <div class="section-title"><span>Istoric Greutate</span></div>
        <div class="group-list">${listHtml}</div>

        <div class="section-title"><span>Backup Date</span></div>
        <div class="input-card" style="display:flex;gap:8px;">
          <button class="btn-secondary" style="flex:1;" onclick="exportBackup()">Export JSON</button>
          <button class="btn-secondary" style="flex:1;" onclick="document.getElementById('import-file').click()">Import JSON</button>
          <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importBackup(event)">
        </div>
      `;
    }

    function addWeight() {
      const date = document.getElementById('w-date').value;
      const kg = parseFloat(document.getElementById('w-kg').value);
      if (!date || isNaN(kg)) return;
      state.weights.push({ date, kg });
      saveState();
      renderWeight();
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'adf-backup.json';
      a.click();
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          state = JSON.parse(ev.target.result);
          saveState();
          renderDayContent();
          renderShopping();
          renderWeight();
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    function switchTab(tab) {
      const tabs = ['plan', 'shop', 'weight'];
      tabs.forEach((t, i) => {
        document.getElementById('tab-' + t).style.display = (t === tab) ? 'block' : 'none';
        document.querySelectorAll('.seg-btn')[i].classList.toggle('active', t === tab);
      });
    }

    // Wall-clock Rest Timer
    let timerEnd = 0;
    let timerInt = null;

    function startTimer(sec) {
      timerEnd = Date.now() + sec * 1000;
      if (timerInt) clearInterval(timerInt);
      updateTimerDisplay();
      timerInt = setInterval(updateTimerDisplay, 250);
    }

    function stopTimer() {
      timerEnd = 0;
      if (timerInt) clearInterval(timerInt);
      document.getElementById('timer-val').textContent = '00:00';
      document.getElementById('timer-val').style.color = 'var(--text)';
    }

    function updateTimerDisplay() {
      const rem = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
      const m = String(Math.floor(rem / 60)).padStart(2, '0');
      const s = String(rem % 60).padStart(2, '0');
      const el = document.getElementById('timer-val');
      el.textContent = `${m}:${s}`;
      el.style.color = rem === 0 ? 'var(--green)' : 'var(--text)';
      if (rem === 0 && timerInt) {
        clearInterval(timerInt);
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    renderDayStrip();
    renderDayContent();
    renderShopping();
    renderWeight();
  </script>
</body>
</html>
